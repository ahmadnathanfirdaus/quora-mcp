# /etc/apache2/sites-available/quora-mcp.conf
# Butuh: a2enmod proxy proxy_http headers ssl
# Ganti mcp.example.com dengan subdomain kamu (A record di Cloudflare, proxied/oranye boleh).
<VirtualHost *:443>
    ServerName mcp.example.com

    SSLEngine on
    # Pakai Cloudflare Origin Certificate atau Let's Encrypt
    SSLCertificateFile    /etc/ssl/cloudflare/origin.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/origin.key

    ProxyPreserveHost On
    ProxyTimeout 120
    # flushpackets=on supaya respons streaming (SSE) MCP nggak ketahan buffer Apache
    ProxyPass        /mcp/    http://127.0.0.1:8787/mcp/ flushpackets=on
    ProxyPassReverse /mcp/    http://127.0.0.1:8787/mcp/
    ProxyPass        /healthz http://127.0.0.1:8787/healthz

    # Jangan log path (isinya secret)
    SetEnvIf Request_URI "^/mcp/" dontlog
    CustomLog ${APACHE_LOG_DIR}/quora-mcp.log combined env=!dontlog
    ErrorLog  ${APACHE_LOG_DIR}/quora-mcp-error.log
</VirtualHost>
